# ARCA — the dogfood venture (Decision D5). A real repo (wealthcx01/arca) with John as founder; the
# graded-trading-card analytics terminal. Its ticket backlog lives on the default branch (FB-030), it
# is onboarded in the studio, and it runs on its own Hetzner box (FB-019/FB-011) with the LibreChat
# conversational composer (FB-025) at chat.arca.bruntsfield.capital.
# Validates against bcap-contracts 0.1.0 `Venture` (schema/Venture.schema.json).

id: arca
name: ARCA
status: active            # a real running app (Bun/Hono/React), live on its own box

# Decision D1: one box per venture. Provisioned via scripts/provision-venture.sh (FB-011).
# `host` also drives the studio's Chat link (FB-025): chat.<host> → the venture's LibreChat.
vps:
  host: arca.bruntsfield.capital
  provider: hetzner
  provisioned_at: "2026-07-28T16:00:00Z"

founder:
  name: John Gallagher
  github_login: wealthcx01
  # The founder account, deliberately SEPARATE from John's Bruntsfield admin address (FB-090).
  # Both john@ and john.gallagher@ are in STUDIO_ADMIN_EMAILS, so signing in with either shows the
  # Bruntsfield view — every venture, the activity page, repository health, the wiring warnings.
  # Useful for running the studio; useless for judging what a founder actually experiences.
  # This address is in no admin list, so it sees ARCA and nothing else — the same shape of access
  # Ross has on THE RESET. Shared Bruntsfield Workspace until spin-out (D3) — never @gmail.com.
  workspace_email: arca.founder@bruntsfield.capital

approval_matrix:
  - change_class: product-visible
    approver: founder
  - change_class: platform-infra
    approver: bruntsfield
  - change_class: high-blast-radius
    approver: dual

repos:
  - arca
  - arca-marketing   # Sell — provisioned FB-045
  - arca-ops         # Scale — provisioned FB-045

lanes:
  - id: arca
    venture_id: arca
    repo: arca
    tmux: arca:main
    standing_order: >-
      Maintain ARCA (the Pokemon-card terminal). Fixture lane for the studio — exercises
      scoping and parser tolerance. One ticket = one branch = one PR; never merge.
    status: idle

# The three founder-owned surfaces (FB-048): Build (product), Sell (go-to-market), Scale (growth/ops).
# The founder→lane loop (docs/founder-to-lane-execution.md) works tickets in ANY of these the same way;
# splitting them lets the founder manage + own product-building, selling, and scaling as distinct
# queues — a cleaner split than Cofounder's departments. Sell/Scale repos aren't provisioned yet, so
# the studio shows them as "coming with your repo" (their repo isn't in `repos` above).
departments:
  - id: build
    venture_id: arca
    name: Build — Product
    repo: arca                  # the real product repo
    queue_path: docs/tickets
    gate: pr                    # engineering changes gate on PR review
    # launch: (FB-093) — the terminal runs on the box but has no public hostname yet (only
    # chat.arca.bruntsfield.capital resolves). Add `launch: {url, label}` here the day it does;
    # until then the board honestly shows "nowhere to open yet".
  - id: sell
    venture_id: arca
    name: Sell — Go-to-market
    repo: arca-marketing        # content + interest-based sends
    queue_path: docs/tickets
    gate: activegraph           # external sends gate on a recorded ActiveGraph approval (research-gtm)
    connectors: []
  - id: scale
    venture_id: arca
    name: Scale — Growth & Ops
    repo: arca-ops              # analytics, ops, finance
    queue_path: docs/tickets
    gate: tbd-fb012             # ops/finance mutations gate; reads free (Phase 4 / FB-012 follow-on)
    connectors: []

connectors: []
