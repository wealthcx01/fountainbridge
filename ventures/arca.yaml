# ARCA — the dogfood venture (Decision D5). A real repo (wealthcx01/arca) with John as founder; the
# graded-trading-card analytics terminal. Its ticket backlog lives on the default branch (FB-030), it
# is onboarded in the studio, and it runs on its own Hetzner box (FB-019/FB-011) with the LibreChat
# conversational composer (FB-025) at chat.arca.bruntsfield.capital.
# Validates against bcap-contracts 0.1.0 `Venture` (schema/Venture.schema.json).

id: arca
name: ARCA
status: active            # a real running app (Bun/Hono/React), live on its own box

# Decision D1: one box per venture. Provisioned via scripts/provision-venture.sh (FB-011).
# `host` also drives the studio's Chat link (FB-025): chat.<host> → the venture's LibreChat.
vps:
  host: arca.bruntsfield.capital
  provider: hetzner
  provisioned_at: "2026-07-28T16:00:00Z"

founder:
  name: John Gallagher
  github_login: wealthcx01
  workspace_email: john@bruntsfield.capital   # shared Bruntsfield Workspace until spin-out (D3) — never @gmail.com

approval_matrix:
  - change_class: product-visible
    approver: founder
  - change_class: platform-infra
    approver: bruntsfield
  - change_class: high-blast-radius
    approver: dual

repos:
  - arca

lanes:
  - id: arca
    venture_id: arca
    repo: arca
    tmux: arca:main
    standing_order: >-
      Maintain ARCA (the Pokemon-card terminal). Fixture lane for the studio — exercises
      scoping and parser tolerance. One ticket = one branch = one PR; never merge.
    status: idle

departments:
  - id: engineering
    venture_id: arca
    name: Engineering
    repo: arca
    queue_path: docs/tickets   # not yet populated — tests empty-queue tolerance
    gate: pr

connectors: []
