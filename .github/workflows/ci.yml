name: CI

# The lane gate (FB-001): lint + typecheck + test must pass on every PR into main.
# The Next.js studio app arrives in FB-005; until a package.json exists at the repo root,
# each job passes trivially so branch protection has real, green status checks to require
# from day one. FB-005 adds the app and the scripts these jobs already call — the job names
# stay stable so the required-checks configuration never has to change.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint
        run: |
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
            npm run lint
          else
            echo "No app yet — lint is a no-op until FB-005 adds the Next.js app."
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck
        run: |
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
            npm run typecheck
          else
            echo "No app yet — typecheck is a no-op until FB-005 adds the Next.js app."
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: |
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
            npm test
          else
            echo "No app yet — tests are a no-op until FB-005 adds the Next.js app."
          fi

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ventures/*.yaml must validate against the bcap-contracts Venture JSON Schema (FB-003).
    # Isolated tool (tools/manifest-validate) so it needs no root package.json / studio app.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ventures/*.yaml against the Venture contract
        run: make validate-manifests

  tickets:
    name: Parse tickets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # docs/tickets/*.md must parse into the bcap-contracts Ticket contract (FB-004): typecheck +
    # unit/corpus/schema tests. Isolated tool (tools/ticket-parser) — no root package.json / app.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse docs/tickets against the Ticket contract
        run: make parse-tickets

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Next.js studio app (FB-005) must compile. Auth secret is a throwaway — build never
    # touches real credentials; runtime secrets live on the deployment env (D8, FB-009).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Build the studio app
        run: npm run build
        env:
          AUTH_SECRET: build-time-placeholder-not-a-real-secret
          AUTH_TRUST_HOST: "true"

  e2e:
    name: Playwright UI gate
    runs-on: ubuntu-latest
    # FB-005 UI-gate: the three authorization cases (admin all / founder scoped / unlisted refused)
    # against a real server, with screenshots uploaded as the per-PR gallery artifact.
    #
    # FB-114: this job had no timeout of any kind, so when the browser install wedged it ran to
    # GitHub's 6-hour ceiling before being cancelled — and every merge waited on it. Twice in one
    # day. A hung gate must fail fast and cheap, not slowly and expensively.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      # Cache the browser itself, keyed on the resolved Playwright version — a version bump must
      # miss the cache, or the run would test against a browser the new version did not ask for.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium
      # No apt, at all (FB-114, amended after it bit again on 2026-08-19).
      #
      # The first version of this bounded `--with-deps` at 8 minutes instead of removing it. That
      # turned a 6-hour hang into an 8-minute failure — better, and still a gate that goes red
      # because an Ubuntu mirror is unreachable, which is not a fact about this repository. The run
      # that proved it spent its whole budget on `Ign: azure.archive.ubuntu.com` retries.
      #
      # `--with-deps` exists for bare systems. The ubuntu-latest runner already carries chromium's
      # libraries, so the browser download is all that is needed — and that is what the cache holds.
      # If a library ever does go missing the tests fail in seconds with a loader error naming it,
      # which is a better failure than apt retrying a mirror for eight minutes.
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run the UI gate
        timeout-minutes: 10
        run: npm run test:e2e
      - name: Upload UI-gate gallery (screenshots + report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gate-gallery
          path: |
            e2e/__screenshots__/
            playwright-report/
          if-no-files-found: ignore

  design:
    name: Design contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # FB-057: the studio design contract (docs/studio-design-contract.md) — tokens only, one status
    # vocabulary, no dead controls. Pure Node, no install: it reads app/ and components/.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce the studio design contract
        run: make design-lint

  copy:
    name: Plain English
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # FB-103: the founder vocabulary contract (lib/glossary.ts) — no engineering words on a founder's
    # screen without a reasoned opt-out. Same shape as the design contract above, and for the same
    # reason: the copy had been fixed by hand four times and kept regressing.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce the founder vocabulary contract
        run: make copy-lint

  ticket-drift:
    name: Tickets match the history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # FB-070: needs the full history — the check reads every commit on main to see what shipped, and
    # a shallow clone would silently find nothing and pass.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Check tickets against what shipped
        run: make ticket-drift

  provision:
    name: Provision scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # FB-011: the venture-provisioning script must stay shellcheck-clean. shellcheck is preinstalled
    # on ubuntu-latest runners; the script is only linted here, never executed (it touches Hetzner).
    steps:
      - uses: actions/checkout@v4
      - name: Lint provisioning scripts
        run: make provision-lint
