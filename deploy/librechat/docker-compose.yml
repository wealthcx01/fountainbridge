# LibreChat deployment for a venture box (FB-025). Runs on the venture's OWN Hetzner VM (D1) — one
# instance per venture, never shared. Minimal stack: LibreChat API + MongoDB + Meilisearch. Reasoning
# is Claude via the Anthropic endpoint (see librechat.yaml + .env). Fronted by the box's Caddy for
# TLS (not in this file). Verify + adjust versions on the box; this is the starting recipe.
services:
  api:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat-api
    restart: unless-stopped
    # Bound to localhost only — the box's Caddy terminates TLS and proxies to it (never public direct).
    ports:
      - "127.0.0.1:3080:3080"
    depends_on:
      - mongodb
      - meilisearch
      - rag_api
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      # FB-034: the persistent knowledge base (RAG). The api sends uploads to rag_api for
      # vectorisation and queries it for file_search. rag_api is a sibling on the private network.
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - RAG_PORT=${RAG_PORT:-8000}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./assets/logo.svg:/app/client/dist/assets/logo.svg:ro   # Bruntsfield Foundry mark (FB-025)
      # FB-033 write tool: the ticket-filer is a stdio MCP server spawned by this container's own
      # node (see librechat.yaml mcpServers.ticket-filer). No sibling container, no URL, no SSRF.
      - ./ticket-mcp/stdio.mjs:/app/foundry/ticket-filer.mjs:ro
      # FB-036 status connector: read-only stdio MCP so the founder can ask "what's in review?".
      - ./status-mcp/stdio.mjs:/app/foundry/status-connector.mjs:ro
      # FB-043 knowledge-deposit: stdio MCP so a founder can save durable facts/files into the
      # venture's git context/library (secret-scanned) — the second-brain bridge to the lanes.
      - ./deposit-mcp/stdio.mjs:/app/foundry/deposit.mjs:ro
      - librechat-images:/app/client/public/images
      - librechat-logs:/app/api/logs

  mongodb:
    image: mongo:7
    container_name: librechat-mongodb
    restart: unless-stopped
    volumes:
      - librechat-mongo:/data/db
    command: mongod --quiet --logpath /dev/null

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: librechat-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - librechat-meili:/meili_data

  # FB-033: the ticket-filer write tool is no longer a sibling container. It is a zero-dependency
  # stdio MCP server (./ticket-mcp/stdio.mjs) mounted into the api container and spawned by its node
  # — see librechat.yaml mcpServers.ticket-filer. TICKET_GITHUB_TOKEN + VENTURE_REPO come from .env.

  # FB-034: persistent knowledge base (RAG). The founder deposits venture files once; the composer
  # searches + cites them. Embeddings run ON THE BOX (D1 isolation — venture file contents never
  # leave the VM): the FULL rag-api image (not -lite) runs a local HuggingFace sentence-transformers
  # model. Vectors live in a local pgvector Postgres. No external embeddings API, no per-use cost.
  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev:latest   # full = bundles sentence_transformers
    container_name: librechat-rag-api
    restart: unless-stopped
    depends_on:
      - vectordb
    env_file:
      - .env
    environment:
      - DB_HOST=vectordb
      - DB_PORT=5432
      - RAG_HOST=0.0.0.0
      - RAG_PORT=${RAG_PORT:-8000}
      - EMBEDDINGS_PROVIDER=huggingface                                  # in-process, CPU, local
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    volumes:
      # Cache the downloaded model so it isn't re-fetched on every restart.
      - rag-hf-cache:/root/.cache/huggingface

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    container_name: librechat-vectordb
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-foundry_rag}
      - POSTGRES_USER=${POSTGRES_USER:-foundry}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}   # generated on the box; never in the repo
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  librechat-mongo:
  librechat-meili:
  librechat-images:
  librechat-logs:
  pgdata:
  rag-hf-cache:
