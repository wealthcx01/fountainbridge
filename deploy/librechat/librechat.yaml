# LibreChat config for a venture box (FB-025). Bruntsfield Foundry surface: a ticket-shaping composer
# on Claude, a write tool (ticket-filer MCP) so an approved ticket becomes a PR, and file uploads so
# the founder can drop in venture-relevant files. Ref: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.2.1
cache: true

interface:
  customWelcome: "Welcome to the Bruntsfield Foundry. Tell me what you want for your venture in plain English — I'll shape it into a proper piece of work and read it back for your OK. Nothing gets built until you say yes. You can also drop in files (a deck, notes, a spreadsheet) for context."
  modelSelect: true      # needed so the founder can reach the tool-using composer agent
  agents: true           # the ticket-filing tool runs through an agent
  presets: false
  parameters: false

# The write tool: the Foundry composer files an approved ticket to the venture backlog as a PR.
# FB-033: stdio transport. LibreChat spawns this file with the api container's own node. A stdio
# server is a local child process (no URL), so it bypasses the SSRF/domain allowlist that blocked
# the earlier streamable-http server ("Domain http://ticket-mcp:3100 is not allowed"). The token +
# repo are interpolated from the box .env. Ref: librechat.ai/docs → mcp_servers.
mcpServers:
  ticket-filer:
    type: stdio
    command: node
    args: ["/app/foundry/ticket-filer.mjs"]
    env:
      TICKET_GITHUB_TOKEN: "${TICKET_GITHUB_TOKEN}"
      VENTURE_REPO: "${VENTURE_REPO}"
    stderr: inherit          # surface the server's logs in `docker logs librechat-api`
    serverInstructions: true
    timeout: 60000           # a PR round-trip to the GitHub API can take a few seconds

endpoints:
  agents:
    disableBuilder: false
    # web_search added (FB-035) so the composer + research agents can look things up. file_search
    # (FB-034) powers the knowledge base. NOTE: execute_code is deliberately EXCLUDED — the founder
    # surface must never run code (John, explicit); execution stays with the agent lanes.
    capabilities: ["tools", "actions", "file_search", "web_search", "context"]

# Web search (FB-035): lets the composer + the Foundry Research agent gather market/competitor/
# pricing context. Provider = Tavily (one key does search + scraping; LLM-optimised). The key lives
# ONLY in the box .env (never in this file — env refs only). Blank key = the capability is present
# but a search simply returns nothing until authorised. Ref: librechat.ai/docs → web_search.
webSearch:
  tavilyApiKey: "${TAVILY_API_KEY}"
  searchProvider: "tavily"
  scraperProvider: "tavily"
  rerankerType: "none"
  safeSearch: 1

# File uploads: let the founder attach venture files to a conversation (a deck, notes, data).
# (Persistent "chat over your whole file store" = RAG, a further add — see docs/librechat-composer.md.)
fileConfig:
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 20      # MB per file
      totalSizeLimit: 100
    agents:
      fileLimit: 10
      fileSizeLimit: 20
      totalSizeLimit: 100

# The founder's default surface is the tool-using "Foundry Composer" AGENT (endpoint: agents), which
# carries the composer system prompt + the ticket-filer write tool. Agents live in Mongo (no YAML) —
# it is created by deploy/librechat/seed-agent.js (the prompt's single source of truth). This modelSpec
# is a thin pointer that pins the agent as the default so the founder lands on it. The agent MUST be
# seeded first (see README) or this default will reference a missing agent_id.
modelSpecs:
  prioritize: true          # the modelSpec is the default selection for a new chat
  list:
    - name: "foundry-composer"
      label: "Foundry Composer"
      default: true          # what the founder lands on
      description: "Turns what you want into a proper piece of work, and files it for your OK."
      preset:
        endpoint: "agents"
        agent_id: "agent_foundry_composer"
    # FB-035: a pure research surface (web search, no ticket-filing) for market/competitor/pricing
    # scans. Also seeded by seed-agent.js.
    - name: "foundry-research"
      label: "Foundry Research"
      description: "Looks up market, competitor, and pricing context — with sources."
      preset:
        endpoint: "agents"
        agent_id: "agent_foundry_research"
