# LibreChat config for a venture box (FB-025). Bruntsfield Foundry surface: a ticket-shaping composer
# on Claude, a write tool (ticket-filer MCP) so an approved ticket becomes a PR, and file uploads so
# the founder can drop in venture-relevant files. Ref: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.2.1
cache: true

interface:
  customWelcome: "Welcome to the Bruntsfield Foundry. Tell me what you want for your venture in plain English — I'll shape it into a proper piece of work and read it back for your OK. Nothing gets built until you say yes. You can also drop in files (a deck, notes, a spreadsheet) for context."
  modelSelect: true      # needed so the founder can reach the tool-using composer agent
  agents: true           # the ticket-filing tool runs through an agent
  memories: true         # FB-036: show the memory toggle + let the founder view/manage memories
  presets: false
  parameters: false
  # FB-065: the Agents API — an OpenAI-compatible endpoint at /api/agents/v1 that lets the STUDIO
  # host the conversation instead of sending the founder to a second product at a second address.
  # Off by default in LibreChat; `use` also grants the API-key routes (/api/apiKeys). `create` stays
  # false: keys are minted once, by an admin, not by whoever is chatting.
  remoteAgents:
    use: true
    create: false
    share: false
    public: false

# The write tool: the Foundry composer files an approved ticket to the venture backlog as a PR.
# FB-033: stdio transport. LibreChat spawns this file with the api container's own node. A stdio
# server is a local child process (no URL), so it bypasses the SSRF/domain allowlist that blocked
# the earlier streamable-http server ("Domain http://ticket-mcp:3100 is not allowed"). The token +
# repo are interpolated from the box .env. Ref: librechat.ai/docs → mcp_servers.
mcpServers:
  ticket-filer:
    type: stdio
    command: node
    args: ["/app/foundry/ticket-filer.mjs"]
    env:
      TICKET_GITHUB_TOKEN: "${TICKET_GITHUB_TOKEN}"
      VENTURE_REPO: "${VENTURE_REPO}"
    stderr: inherit          # surface the server's logs in `docker logs librechat-api`
    serverInstructions: true
    timeout: 60000           # a PR round-trip to the GitHub API can take a few seconds
  # FB-036 status connector: READ-ONLY. Lets the founder ask "what's in review?" / "what shipped?".
  # Same stdio shape as the ticket-filer. Reuses the venture token for reads (never writes).
  status:
    type: stdio
    command: node
    args: ["/app/foundry/status-connector.mjs"]
    env:
      STATUS_GITHUB_TOKEN: "${STATUS_GITHUB_TOKEN}"
      TICKET_GITHUB_TOKEN: "${TICKET_GITHUB_TOKEN}"
      VENTURE_REPO: "${VENTURE_REPO}"
    stderr: inherit
    serverInstructions: true
    timeout: 30000
  # FB-043 knowledge deposit: save durable founder facts/files into the venture's git context/library
  # (secret-scanned) so the agent lanes can read them. Same stdio shape; a human merges the deposit PR.
  deposit:
    type: stdio
    command: node
    args: ["/app/foundry/deposit.mjs"]
    env:
      DEPOSIT_GITHUB_TOKEN: "${DEPOSIT_GITHUB_TOKEN}"
      TICKET_GITHUB_TOKEN: "${TICKET_GITHUB_TOKEN}"
      VENTURE_REPO: "${VENTURE_REPO}"
    stderr: inherit
    serverInstructions: true
    timeout: 60000
  # FB-050 venture brain: READ-ONLY semantic search over everything the venture knows (the founder's
  # deposited context/library, the ticket backlog, the code). gbrain itself runs on the HOST — its
  # index is a single-writer local database that must not be shared into a container — so this stdio
  # server forwards to the host's read-only bridge (deploy/lane/brain-bridge.mjs). The same brain the
  # agent lanes plan from, so the composer and the work never disagree about what the venture knows.
  venture-brain:
    type: stdio
    command: node
    args: ["/app/foundry/brain-search.mjs"]
    env:
      FOUNDRY_BRAIN_URL: "${FOUNDRY_BRAIN_URL}"
      FOUNDRY_BRAIN_TOKEN: "${FOUNDRY_BRAIN_TOKEN}"
    stderr: inherit
    serverInstructions: true
    timeout: 120000          # a cold local embedding of the question can take a few seconds

endpoints:
  agents:
    disableBuilder: false
    # web_search added (FB-035) so the composer + research agents can look things up. file_search
    # (FB-034) powers the knowledge base. NOTE: execute_code is deliberately EXCLUDED — the founder
    # surface must never run code (John, explicit); execution stays with the agent lanes.
    capabilities: ["tools", "actions", "file_search", "web_search", "context"]

# Web search (FB-035): lets the composer + the Foundry Research agent gather market/competitor/
# pricing context. Provider = Tavily (one key does search + scraping; LLM-optimised). The key lives
# ONLY in the box .env (never in this file — env refs only). Set TAVILY_API_KEY BEFORE relying on
# this: until it's set, web search is unavailable (LibreChat may prompt the user for a key, which is
# confusing on a non-technical surface). Ref: librechat.ai/docs → web_search.
webSearch:
  tavilyApiKey: "${TAVILY_API_KEY}"
  searchProvider: "tavily"
  scraperProvider: "tavily"
  rerankerType: "none"
  safeSearch: 1

# Memory (FB-036): the composer remembers DURABLE founder preferences + venture facts across chats
# (it does not index or search past conversations — it's a small key/value store). A cheap background
# agent extracts them; personalize:true gives the founder a per-chat memory toggle + view/manage UI
# (interface.memories). validKeys restricts what can be stored. Ref: librechat.ai/docs → memory.
memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
  messageWindowSize: 5
  validKeys:
    - "founder_preferences"
    - "venture_facts"
  agent:
    enabled: true                         # required for AUTOMATIC extraction (LibreChat made it opt-in)
    provider: "anthropic"
    model: "claude-haiku-4-5-20251001"    # cheap model — memory extraction is a background task
    instructions: |
      Extract only DURABLE facts worth remembering across chats: the founder's stated preferences
      (tone, how they like work scoped, what they care about) and stable venture facts (who it's for,
      positioning, pricing decisions). Do NOT store one-off chat details, secrets, tokens, PATs, or
      anything sensitive. Keep each memory short and factual.

# File uploads: let the founder attach venture files to a conversation (a deck, notes, data).
# (Persistent "chat over your whole file store" = RAG, a further add — see docs/librechat-composer.md.)
fileConfig:
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 20      # MB per file
      totalSizeLimit: 100
    agents:
      fileLimit: 10
      fileSizeLimit: 20
      totalSizeLimit: 100

# The founder's default surface is the tool-using "Foundry Composer" AGENT (endpoint: agents), which
# carries the composer system prompt + the ticket-filer write tool. Agents live in Mongo (no YAML) —
# it is created by deploy/librechat/seed-agent.js (the prompt's single source of truth). This modelSpec
# is a thin pointer that pins the agent as the default so the founder lands on it. The agent MUST be
# seeded first (see README) or this default will reference a missing agent_id.
modelSpecs:
  prioritize: true          # the modelSpec is the default selection for a new chat
  # Founders cannot leave the agent surface. Without this, `ENDPOINTS` still offers the raw
  # `anthropic` endpoint — a Claude with NO tools — and a founder who lands there gets a model that
  # will happily DESCRIBE filing a ticket it has no way to file. That happened: on 2026-07-29 the
  # composer answered "File venture ticket: arca-price-history" (the example slug from its own
  # prompt), and only admitted nothing had been written when the founder thought to ask "did that
  # actually send to Git?". Telling a founder work happened when it did not is the worst failure this
  # product has, so the surface that makes it possible is closed rather than documented.
  enforce: true
  list:
    - name: "foundry-composer"
      label: "Foundry Composer"
      default: true          # what the founder lands on
      description: "Turns what you want into a proper piece of work, and files it for your OK."
      preset:
        endpoint: "agents"
        agent_id: "agent_foundry_composer"
    # FB-035: a pure research surface (web search, no ticket-filing) for market/competitor/pricing
    # scans. Also seeded by seed-agent.js.
    - name: "foundry-research"
      label: "Foundry Research"
      description: "Looks up market, competitor, and pricing context — with sources."
      preset:
        endpoint: "agents"
        agent_id: "agent_foundry_research"
